services:
  - type: web
    name: supportiq-ai
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SUPPORTIQ_MAX_ROWS          # keep memory within the free 512 MB instance
        value: "20000"
      - key: SUPPORTIQ_MAX_UPLOAD_MB
        value: "10"
